name: Authentication

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authentication:
    name: Runner authentication and race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting and module dependencies
        shell: bash
        run: |
          test -z "$(gofmt -l pkg internal cmd)"
          go mod tidy -diff
      - name: Vet runner authentication
        run: go vet ./...
      - name: Verify runner authentication and concurrent token refresh
        run: go test -race ./...
